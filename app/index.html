<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Cotizaciones · M&M Medical</title>
<!-- Librerías de cliente en la nube -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="assets/logo-b64.js"></script>
<style>
:root{
  --teal-900:#0b3d4b;
  --teal-800:#0e5468;
  --teal-700:#0f7a8a;
  --teal-600:#159aab;
  --teal-500:#1fb6c4;
  --azul-950:#1B3A6B;
  --azul-800:#244c8c;
  --lima:#8dc63f;
  --papel:#f4f8f8;
  --tarjeta:#ffffff;
  --linea:#dfe7e8;
  --texto:#1c2b33;
  --texto-suave:#5c6b73;
  --radio:12px;
  --sombra:0 1px 2px rgba(11,39,64,.06), 0 10px 26px -14px rgba(11,61,75,.22);
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --sans:"Inter","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--papel);color:var(--texto);font-family:var(--sans);}
body{min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;}

.app-shell{max-width:1080px;margin:0 auto;padding:20px 24px 70px;}
.app-shell.wide-nueva{max-width:1320px;}

/* ---------- Topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:6px 0 10px;flex-wrap:wrap;}
.top-btn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--azul-950);background:#fff;border:1px solid var(--linea);padding:9px 16px;border-radius:30px;cursor:pointer;box-shadow:var(--sombra);transition:.15s;}
.top-btn:hover{border-color:var(--azul-950);color:var(--azul-800);}
.top-btn.accent{background:var(--teal-700);color:#fff;border-color:var(--teal-700);}
.top-btn.accent:hover{background:var(--teal-800);color:#fff;}

/* ---------- Views ---------- */
.view{display:none;}
.view.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Home ---------- */
.home-wrap{display:flex;flex-direction:column;align-items:center;padding:46px 0 10px;text-align:center;}
.home-logo{height:110px;object-fit:contain;margin-bottom:28px;}
.menu-btns{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:640px;}
.menu-btns .full{grid-column:1 / -1;}
.mbtn{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--teal-700),var(--teal-900));color:#fff;border:none;border-radius:var(--radio);padding:22px 22px;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:var(--sombra);transition:.15s;text-align:left;}
.mbtn:hover{transform:translateY(-2px);filter:brightness(1.06);}
.mbtn .ic{width:34px;height:34px;flex:0 0 auto;}
@media(max-width:600px){.menu-btns{grid-template-columns:1fr;}}

/* ---------- generic sections ---------- */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.section-head h2{font-size:21px;margin:0;color:var(--azul-950);letter-spacing:-.2px;}
.back{font-size:13px;color:var(--teal-700);cursor:pointer;font-weight:700;display:flex;align-items:center;gap:4px;}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:22px;margin-bottom:18px;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr;}}

label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--texto-suave);margin-bottom:5px;}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--linea);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--texto);transition:.15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-600);box-shadow:0 0 0 3px rgba(21,154,171,.14);}
input.err,select.err{border-color:#c0442c;box-shadow:0 0 0 3px rgba(192,68,44,.12);}
textarea{resize:vertical;min-height:70px;}
.field{position:relative;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:700;border:1px solid transparent;cursor:pointer;transition:.15s;}
.btn-primary{background:var(--azul-950);color:#fff;}
.btn-primary:hover{background:var(--azul-800);}
.btn-accent{background:var(--teal-700);color:#fff;}
.btn-accent:hover{background:var(--teal-800);}
.btn-ghost{background:transparent;border-color:var(--linea);color:var(--texto);}
.btn-ghost:hover{border-color:var(--teal-500);color:var(--teal-800);}
.btn-danger{background:transparent;border-color:var(--linea);color:#c0442c;}
.btn-danger:hover{background:#fbeae6;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.ac-wrap{position:relative;width:100%;}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;background:#ffffff;border:1px solid #b8d0db;border-radius:10px;box-shadow:0 12px 32px rgba(11,39,64,.2), 0 2px 8px rgba(0,0,0,.06);max-height:280px;overflow-y:auto;z-index:1000;display:none;width:100%;}
.ac-list.show{display:block;}
.ac-list.ac-products{width:560px;max-width:90vw;}
.ac-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0f4f5;transition:background .12s;}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.hi{background:#e8f7f8;}
.ac-item .c1{font-weight:700;color:var(--azul-950);}
.ac-item .c2{color:var(--texto-suave);font-size:11.5px;}

/* Card de producto en autocomplete */
.ac-prod-card{padding:10px 14px;cursor:pointer;border-bottom:1px solid #eef2f4;display:flex;flex-direction:column;gap:4px;transition:background .12s;}
.ac-prod-card:last-child{border-bottom:none;}
.ac-prod-card:hover,.ac-prod-card.hi{background:#e8f7f8;}
.ac-prod-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ac-badge-code{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--azul-950);background:#e1ebf5;padding:2px 8px;border-radius:4px;border:1px solid #c5d8eb;}
.ac-badge-iva{font-size:11px;font-weight:700;color:var(--teal-700);background:#e6f6f8;padding:2px 7px;border-radius:4px;}
.ac-badge-costo{font-family:var(--mono);font-size:11.5px;color:var(--texto-suave);font-weight:600;}
.ac-prod-name{font-size:13px;font-weight:600;color:var(--texto);line-height:1.35;}
.ac-prod-prov{font-size:11px;color:var(--texto-suave);}

/* Layout de la tabla sin barras de desplazamiento internas */
.items-table-wrap{overflow:visible;position:relative;width:100%;}
.items-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
.items-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--azul-950);font-weight:700;border-bottom:2px solid var(--linea);padding:10px 6px;background:#f8fafb;}
.items-table td{padding:7px 5px;border-bottom:1px solid #eef1f0;vertical-align:middle;position:relative;}
.items-table input{padding:7px 8px;font-size:12.5px;width:100%;box-sizing:border-box;}
.items-table .num{text-align:right;font-family:var(--mono);font-weight:600;color:var(--azul-950);font-size:12.5px;}
.items-table .rm{background:none;border:none;color:var(--texto-suave);cursor:pointer;font-size:16px;padding:5px 7px;border-radius:6px;transition:.15s;}
.items-table .rm:hover{background:#fbeae6;color:#c0442c;}
.col-cod{width:11%;}.col-desc{width:29%;}.col-cant{width:6%;}.col-vu{width:10%;}.col-iva{width:6%;}.col-vi{width:9%;}.col-vt{width:10%;}.col-util{width:6%;}.col-costo{width:9%;}.col-prov{width:9%;}.col-rm{width:3.5%;text-align:center;}

.totals{display:flex;justify-content:flex-end;margin-top:14px;}
.totals table{font-size:14px;}
.totals td{padding:4px 10px;}
.totals td:first-child{color:var(--texto-suave);text-align:right;}
.totals td:last-child{font-family:var(--mono);text-align:right;min-width:120px;font-weight:600;}
.totals tr.total td{font-size:17px;font-weight:800;color:var(--azul-950);border-top:2px solid var(--linea);padding-top:8px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--azul-950);color:#fff;padding:12px 20px;border-radius:9px;font-size:13.5px;box-shadow:var(--sombra);opacity:0;pointer-events:none;transition:.25s;z-index:100;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:#c0442c;}

.list-row{display:grid;grid-template-columns:110px 1fr 130px 150px 90px;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #eef1f0;font-size:13px;cursor:pointer;}
.list-row:hover{background:#f2fbfb;}
.list-row.head{cursor:default;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-suave);font-weight:700;}
.list-row.head:hover{background:none;}
.list-row .n{font-family:var(--mono);font-weight:700;color:var(--teal-700);}
@media(max-width:760px){.list-row{grid-template-columns:1fr 1fr;}.list-row span:nth-child(3),.list-row span:nth-child(5){display:none;}}

.search-bar{display:flex;gap:10px;margin-bottom:14px;}
.search-bar input{flex:1;}
.empty{text-align:center;padding:50px 20px;color:var(--texto-suave);}
.empty .ic{font-size:34px;margin-bottom:10px;}

.client-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid #eef1f0;font-size:13px;}
.client-row.head{font-size:10.5px;text-transform:uppercase;color:var(--texto-suave);font-weight:700;letter-spacing:.04em;}
.chip{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;background:#e8f7f8;color:var(--teal-800);font-size:12.5px;font-weight:700;}

/* Status badge cloud */
.cloud-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--teal-700);background:#e6f6f8;padding:4px 10px;border-radius:20px;}
.cloud-dot{width:7px;height:7px;border-radius:50%;background:#159aab;display:inline-block;animation:pulse 2s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}
</style>
</head>
<body>
<div class="app-shell">

  <div class="topbar" id="topbar">
    <span class="cloud-badge" id="cloudStatus"><span class="cloud-dot"></span> Supabase Conectado</span>
    <button class="top-btn" onclick="Router.go('actualizar-excel')">📊 Actualizar Datos (Excel)</button>
    <button class="top-btn" onclick="Router.go('asesores')">👤 Asesores</button>
  </div>

  <!-- HOME -->
  <div class="view active" id="view-home">
    <div class="home-wrap">
      <img class="home-logo" src="assets/logo.png" alt="Representaciones M&M Medical">
      <div class="menu-btns">
        <button class="mbtn" onclick="Router.go('nueva')">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h4"/></svg>
          Nueva cotización
        </button>
        <button class="mbtn" onclick="Router.go('guardadas')">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Cotizaciones guardadas
        </button>
        <button class="mbtn full" onclick="Router.go('actualizar-excel')" style="background:linear-gradient(135deg, #1B3A6B, #0e5468);">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Actualizar Base de Datos (Excel → Supabase)
        </button>
      </div>
    </div>
  </div>

  <div class="view" id="view-nueva"></div>
  <div class="view" id="view-guardadas"></div>
  <div class="view" id="view-asesores"></div>
  <div class="view" id="view-actualizar-excel"></div>

</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
