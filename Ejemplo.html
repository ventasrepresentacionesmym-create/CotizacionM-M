<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulación · Sistema de Cotizaciones M&M Medical</title>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --teal-900:#0b3d4b;
  --teal-800:#0e5468;
  --teal-700:#0f7a8a;
  --teal-600:#159aab;
  --teal-500:#1fb6c4;
  --azul-950:#1B3A6B;
  --azul-800:#244c8c;
  --lima:#8dc63f;
  --papel:#f8fafc;
  --tarjeta:#ffffff;
  --linea:#e2e8f0;
  --texto:#1e293b;
  --texto-suave:#64748b;
  --radio:10px;
  --sombra:0 1px 3px rgba(0,0,0,.04), 0 6px 16px -6px rgba(27,58,107,.08);
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--papel);color:var(--texto);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
body{min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;}

.app-shell{max-width:1080px;margin:0 auto;padding:24px 28px 70px;}
.app-shell.wide-nueva{max-width:1320px;}

.topbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:8px 0 20px;flex-wrap:wrap;}
.top-btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--azul-950);background:#fff;border:1px solid var(--linea);padding:8px 16px;border-radius:20px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:all .15s ease;}
.top-btn:hover{border-color:var(--azul-800);background:#f8fafc;}

.view{display:none;}
.view.active{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.home-wrap{display:flex;flex-direction:column;align-items:center;padding:50px 0 20px;text-align:center;}
.home-logo{height:105px;object-fit:contain;margin-bottom:44px;}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:580px;}
.home-card{display:flex;align-items:center;justify-content:center;gap:14px;background:#ffffff;border:1px solid var(--linea);border-radius:var(--radio);padding:22px 24px;cursor:pointer;box-shadow:var(--sombra);transition:all .15s ease;text-align:center;}
.home-card:hover{border-color:var(--azul-950);transform:translateY(-2px);box-shadow:0 6px 20px rgba(27,58,107,.1);}
.home-card-icon{width:38px;height:38px;border-radius:8px;background:#f0f7fa;color:var(--teal-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s ease;}
.home-card:hover .home-card-icon{background:var(--azul-950);color:#ffffff;}
.home-card-title{font-size:15.5px;font-weight:700;color:var(--azul-950);letter-spacing:-.1px;}
@media(max-width:600px){.menu-grid{grid-template-columns:1fr;}}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.section-head h2{font-size:20px;margin:0;color:var(--azul-950);font-weight:700;letter-spacing:-.2px;}
.back{font-size:13px;color:var(--teal-700);cursor:pointer;font-weight:600;display:flex;align-items:center;gap:4px;}
.back:hover{text-decoration:underline;}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:0 1px 3px rgba(0,0,0,.04);padding:22px;margin-bottom:18px;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr;}}

label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--texto-suave);margin-bottom:5px;}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--linea);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--texto);transition:.15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-600);box-shadow:0 0 0 3px rgba(21,154,171,.12);}
input.err,select.err{border-color:#c0442c;box-shadow:0 0 0 3px rgba(192,68,44,.12);}
textarea{resize:vertical;min-height:90px;}
.field{position:relative;}

.combo-field{position:relative;width:100%;}
.combo-field input{padding-right:34px;cursor:pointer;}
.combo-field input:focus{cursor:text;}
.combo-arrow-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--texto-suave);cursor:pointer;transition:all .15s ease;user-select:none;}
.combo-arrow-btn:hover{background:#f1f5f9;color:var(--azul-950);}
.combo-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,.12);max-height:220px;overflow-y:auto;z-index:1000;display:none;padding:4px 0;}
.combo-dropdown.show{display:block;animation:fade .15s ease;}
.combo-option{padding:9px 13px;font-size:13px;color:var(--texto);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .12s;}
.combo-option:hover,.combo-option.hi{background:#f0f9fa;color:var(--azul-950);font-weight:600;}
.combo-option.selected{background:#e6f6f8;color:var(--teal-800);font-weight:700;}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:all .15s ease;}
.btn-primary{background:var(--azul-950);color:#fff;}
.btn-primary:hover{background:var(--azul-800);}
.btn-accent{background:var(--teal-700);color:#fff;}
.btn-accent:hover{background:var(--teal-800);}
.btn-ghost{background:#fff;border-color:var(--linea);color:var(--texto);}
.btn-ghost:hover{border-color:var(--teal-600);color:var(--teal-700);}
.btn-danger{background:#fff;border-color:#fecaca;color:#dc2626;}
.btn-danger:hover{background:#fef2f2;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.ac-wrap{position:relative;width:100%;}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,.1);max-height:280px;overflow-y:auto;z-index:1000;display:none;width:100%;}
.ac-list.show{display:block;}
.ac-list.ac-products{width:560px;max-width:90vw;}
.ac-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:background .12s;}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.hi{background:#f0f9ff;}
.ac-item .c1{font-weight:700;color:var(--azul-950);}
.ac-item .c2{color:var(--texto-suave);font-size:11.5px;}

.ac-prod-card{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;flex-direction:column;gap:4px;transition:background .12s;}
.ac-prod-card:last-child{border-bottom:none;}
.ac-prod-card:hover,.ac-prod-card.hi{background:#f0f9ff;}
.ac-prod-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ac-badge-code{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--azul-950);background:#f1f5f9;padding:2px 8px;border-radius:4px;border:1px solid #e2e8f0;}
.ac-badge-iva{font-size:11px;font-weight:700;color:var(--teal-700);background:#f0fdf4;padding:2px 7px;border-radius:4px;}
.ac-badge-costo{font-family:var(--mono);font-size:11.5px;color:var(--texto-suave);font-weight:600;}
.ac-prod-name{font-size:13px;font-weight:600;color:var(--texto);line-height:1.35;}
.ac-prod-prov{font-size:11px;color:var(--texto-suave);}

.items-table-wrap{overflow:visible;position:relative;width:100%;}
.items-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
.items-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--azul-950);font-weight:700;border-bottom:2px solid var(--linea);padding:10px 6px;background:#f8fafc;}
.items-table td{padding:7px 5px;border-bottom:1px solid #f1f5f9;vertical-align:middle;position:relative;}
.items-table input{padding:7px 8px;font-size:12.5px;width:100%;box-sizing:border-box;}
.items-table .num{text-align:right;font-family:var(--mono);font-weight:600;color:var(--azul-950);font-size:12.5px;}
.items-table .rm{background:none;border:none;color:var(--texto-suave);cursor:pointer;font-size:16px;padding:5px 7px;border-radius:6px;transition:.15s;}
.items-table .rm:hover{background:#fef2f2;color:#dc2626;}
.col-cod{width:11%;}.col-desc{width:29%;}.col-cant{width:6%;}.col-vu{width:10%;}.col-iva{width:6%;}.col-vi{width:9%;}.col-vt{width:10%;}.col-util{width:6%;}.col-costo{width:9%;}.col-prov{width:9%;}.col-rm{width:3.5%;text-align:center;}

.totals{display:flex;justify-content:flex-end;margin-top:14px;}
.totals table{font-size:14px;}
.totals td{padding:4px 10px;}
.totals td:first-child{color:var(--texto-suave);text-align:right;}
.totals td:last-child{font-family:var(--mono);text-align:right;min-width:120px;font-weight:600;}
.totals tr.total td{font-size:17px;font-weight:800;color:var(--azul-950);border-top:2px solid var(--linea);padding-top:8px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--azul-950);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:.2s ease;z-index:1000;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:#dc2626;}

.list-row{display:grid;grid-template-columns:110px 1fr 130px 150px 110px;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #f1f5f9;font-size:13px;cursor:pointer;}
.list-row:hover{background:#f8fafc;}
.list-row.head{cursor:default;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--texto-suave);font-weight:700;user-select:none;background:#f8fafc;border-radius:6px;}
.list-row.head:hover{background:#f8fafc;}
.list-row.head span{cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:color .12s;}
.list-row.head span:hover{color:var(--azul-950);}
.list-row.head span.sorted{color:var(--azul-950);font-weight:800;}
.list-row .n{font-family:var(--mono);font-weight:700;color:var(--teal-700);}
@media(max-width:760px){.list-row{grid-template-columns:1fr 1fr;}.list-row span:nth-child(3),.list-row span:nth-child(5){display:none;}}

.search-bar{display:flex;gap:10px;margin-bottom:14px;}
.search-bar input{flex:1;}
.empty{text-align:center;padding:50px 20px;color:var(--texto-suave);}
.empty .ic{font-size:34px;margin-bottom:10px;}

.cloud-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--teal-800);background:#f0fdf4;padding:4px 10px;border-radius:15px;border:1px solid #bbf7d0;}
.cloud-dot{width:6px;height:6px;border-radius:50%;background:#16a34a;}

.data-summary-box{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:14px;}
.data-metric{background:#f8fafc;border:1px solid var(--linea);border-radius:8px;padding:16px;text-align:center;}
.data-metric-val{font-size:24px;font-weight:800;color:var(--azul-950);margin-bottom:4px;font-family:var(--mono);}
.data-metric-lbl{font-size:12px;font-weight:600;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.04em;}
@media(max-width:640px){.data-summary-box{grid-template-columns:1fr;}}

.sync-card{margin-top:20px;padding:18px 20px;background:#f8fafc;border-radius:10px;border:1px solid var(--linea);}
.sync-title{font-size:15px;font-weight:700;color:var(--azul-950);display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.sync-desc{font-size:13px;color:var(--texto-suave);line-height:1.5;margin-bottom:16px;}
.sync-folder-info{display:inline-flex;align-items:center;gap:6px;background:#e0f2fe;color:#0369a1;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid #bae6fd;}
.sync-progress-wrap{margin-top:14px;background:#e2e8f0;border-radius:8px;height:10px;overflow:hidden;position:relative;display:none;}
.sync-progress-bar{height:100%;background:linear-gradient(90deg,var(--teal-600),var(--teal-500));width:0%;transition:width .2s ease;border-radius:8px;}
.sync-status-msg{margin-top:10px;font-size:12.5px;font-weight:600;color:var(--azul-950);display:none;}
.sync-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;}
</style>
</head>

</div>

<script>

   ============================================================ */

  cotizaciones: [

const DB = {
  getDatos() { return STATE.datos; },

  setCotizaciones(v) { STATE.cotizaciones = v; },

/* ============================================================
   HELPERS
   ============================================================ */
function toast(msg, isError) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove("show"), 3500);
}
function fmtCOP(n) {
  n = Math.round(Number(n) || 0);
  return "$" + n.toLocaleString("es-CO");
}
function parseNum(v) {
  if (typeof v === "number") return v;
  if (!v) return 0;
  return Number(String(v).replace(/[^0-9.-]/g, "")) || 0;
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* Normaliza texto: minúsculas y sin tildes, para búsquedas tolerantes a acentos */
function norm(s) {
  return String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

const Router = {
  current: "home",
  go(view, opts) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    const target = document.getElementById("view-" + view);
    if (target) target.classList.add("active");
    const shell = document.querySelector(".app-shell");
    if (shell) shell.classList.toggle("wide-nueva", view === "nueva");
    this.current = view;
    if (view === "nueva") Views.renderNueva(opts && opts.record);
    if (view === "guardadas") Views.renderGuardadas();
    if (view === "asesores") Views.renderAsesores();
    if (view === "actualizar-excel") Views.renderActualizarExcel();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
};

/* ============================================================
   AUTOCOMPLETE + COMBO (igual que la app real)
   ============================================================ */
function attachAutocomplete(inputEl, listEl, getItems, renderItem, onPick, itemClass = "ac-item") {
  if (!inputEl || !listEl) return;
  let hi = -1, items = [];
  function close() { listEl.classList.remove("show"); listEl.innerHTML = ""; hi = -1; }
  inputEl.addEventListener("input", () => {
    const q = norm(inputEl.value);
    items = q ? getItems(q).slice(0, 40) : [];
    if (!items.length) return close();
    listEl.innerHTML = items.map((it, i) => `<div class="${itemClass}" data-i="${i}">${renderItem(it)}</div>`).join("");
    listEl.classList.add("show");
    hi = -1;
  });
  listEl.addEventListener("mousedown", e => {
    const row = e.target.closest(`.${itemClass.split(" ")[0]}`) || e.target.closest(".ac-item");
    if (!row) return;
    e.preventDefault();
    onPick(items[+row.dataset.i]);
    close();
  });
  inputEl.addEventListener("keydown", e => {
    const rows = [...listEl.querySelectorAll(`.${itemClass.split(" ")[0]}`)];
    if (!rows.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); hi = Math.min(hi + 1, rows.length - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); hi = Math.max(hi - 1, 0); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (hi >= 0 && items[hi]) { onPick(items[hi]); close(); }
      return;
    } else if (e.key === "Escape") { close(); return; }
    else return;
    rows.forEach((r, i) => r.classList.toggle("hi", i === hi));
    rows[hi] && rows[hi].scrollIntoView({ block: "nearest" });
  });
  inputEl.addEventListener("blur", () => setTimeout(close, 200));
}

function attachDropdownCombo(inputEl, dropdownEl, arrowBtnEl, options) {
  if (!inputEl || !dropdownEl) return;
  let hi = -1;
  function render(filter = "") {
    const q = norm(filter);
    const filtered = q ? options.filter(o => norm(o).includes(q)) : options;
    const currentVal = norm(inputEl.value);
    if (!filtered.length) {
      dropdownEl.innerHTML = `<div style="padding:10px 14px;font-size:12.5px;color:var(--texto-suave);text-align:center">No hay coincidencias (puedes escribir texto libre)</div>`;
    } else {
      dropdownEl.innerHTML = filtered.map((opt, i) => {
        const isSelected = norm(opt) === currentVal;
        return `
          <div class="combo-option ${isSelected ? "selected" : ""}" data-i="${i}" data-val="${esc(opt)}">
            <span>${esc(opt)}</span>
            ${isSelected ? `<span style="color:var(--teal-600);font-size:13px;font-weight:bold">✓</span>` : ""}
          </div>
        `;
      }).join("");
    }
    hi = -1;
  }
  function open() { render(inputEl.value); dropdownEl.classList.add("show"); }
  function close() { dropdownEl.classList.remove("show"); hi = -1; }
  function toggle() {
    if (dropdownEl.classList.contains("show")) { close(); }
    else { render(""); dropdownEl.classList.add("show"); inputEl.focus(); }
  }
  inputEl.addEventListener("focus", () => open());
  inputEl.addEventListener("click", () => open());
  inputEl.addEventListener("input", () => { render(inputEl.value); dropdownEl.classList.add("show"); });
  if (arrowBtnEl) arrowBtnEl.addEventListener("mousedown", e => { e.preventDefault(); toggle(); });
  dropdownEl.addEventListener("mousedown", e => {
    const optEl = e.target.closest(".combo-option");
    if (!optEl || !optEl.dataset.val) return;
    e.preventDefault();
    inputEl.value = optEl.dataset.val;
    close();
    inputEl.classList.remove("err");
    inputEl.dispatchEvent(new Event("input", { bubbles: true }));
    inputEl.dispatchEvent(new Event("change", { bubbles: true }));
  });
  inputEl.addEventListener("blur", () => setTimeout(close, 200));
  inputEl.addEventListener("keydown", e => {
    const rows = [...dropdownEl.querySelectorAll(".combo-option")];
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (!dropdownEl.classList.contains("show")) { open(); return; }
      if (!rows.length) return;
      hi = Math.min(hi + 1, rows.length - 1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (!rows.length) return;
      hi = Math.max(hi - 1, 0);
    } else if (e.key === "Enter") {
      if (dropdownEl.classList.contains("show") && hi >= 0 && rows[hi] && rows[hi].dataset.val) {
        e.preventDefault();
        inputEl.value = rows[hi].dataset.val;
        close();
        return;
      }
    } else if (e.key === "Escape") { close(); return; }
    else return;
    rows.forEach((r, i) => r.classList.toggle("hi", i === hi));
    rows[hi] && rows[hi].scrollIntoView({ block: "nearest" });
  });
}

  const btnSync = document.getElementById("btnSyncFolder");
  const btnReload = document.getElementById("btnReloadSupabase");
  const manualInput = document.getElementById("manualFileInput");

  function showProgress(pct, msg) {
    if (progressWrap) progressWrap.style.display = "block";
    if (progressBar) progressBar.style.width = pct + "%";
    if (statusMsg) {
      statusMsg.style.display = "block";
      statusMsg.textContent = msg;
    }
  }

    setTimeout(() => {
      if (progressWrap) progressWrap.style.display = "none";
      if (statusMsg) statusMsg.style.display = "none";
    }, 4000);

      { p: 30, m: "Leyendo archivos de Excel..." },

        if (btnReload) btnReload.disabled = false;
        hideProgress();
      }
    }, 180);

  if (btnSync) btnSync.addEventListener("click", runFakeSync);

  if (btnChange) btnChange.addEventListener("click", () => toast("📁 Simulación: aquí se abriría el selector de carpeta Dropbox"));

      setTimeout(() => runFakeSync(), 300);

  });
  if (btnReload) btnReload.addEventListener("click", () => {
    btnReload.disabled = true;
    btnReload.textContent = "Recargando...";
    setTimeout(() => {
      btnReload.disabled = false;

      toast(`Datos recargados: ${totalProd.toLocaleString("es-CO")} productos y ${totalClie.toLocaleString("es-CO")} clientes.`);
    }, 800);
  });
};

/* ---------- 👤 ASESORES (CRUD local simulado) ---------- */
Views.renderAsesores = function () {
  const el = document.getElementById("view-asesores");
  el.innerHTML = `
    <div class="section-head">
      <h2>Asesores</h2>
      <span class="back" onclick="Router.go('home')">← Volver al inicio</span>
    </div>
    <div class="card">
      <div class="search-bar">
        <input id="asesorNombre" placeholder="Nombre del nuevo asesor..." maxlength="80" autocomplete="off">
        <button class="btn btn-accent" id="addAsesorBtn">+ Agregar</button>
      </div>
      <div id="asesorList"></div>
    </div>
  `;

  let editingIndex = -1;
  let deletingIndex = -1;

  function getAsesoresList() {
    if (!STATE.cyp) STATE.cyp = { clientes: [], asesores: [] };
    if (!Array.isArray(STATE.cyp.asesores)) STATE.cyp.asesores = [];
    return STATE.cyp.asesores;
  }

  function paintAsesores() {
    const list = document.getElementById("asesorList");
    if (!list) return;
    const asesores = getAsesoresList();
    if (!asesores.length) {
      list.innerHTML = `<div class="empty" style="padding:24px 0">No hay asesores registrados. Agrega uno arriba.</div>`;
      return;
    }
    list.innerHTML = asesores.map((a, i) => {
      if (editingIndex === i) {
        return `
          <div class="list-row" style="grid-template-columns:1fr auto auto;gap:8px;background:#f0f9fa;padding:8px 12px;cursor:default">
            <input id="editAsesorInput_${i}" value="${esc(a)}" maxlength="80" style="padding:6px 10px;font-size:13.5px;font-weight:600" />
            <button class="btn btn-accent" data-save-edit="${i}" style="padding:6px 12px">Guardar</button>
            <button class="btn btn-ghost" data-cancel-edit="${i}" style="padding:6px 12px">Cancelar</button>
          </div>
        `;
      }
      if (deletingIndex === i) {
        return `
          <div class="list-row" style="grid-template-columns:1fr auto auto;gap:8px;background:#fbeae6;padding:8px 12px;cursor:default">
            <span style="color:#c0442c;font-size:13px;font-weight:600">¿Eliminar a "${esc(a)}"?</span>
            <button class="btn btn-danger" data-confirm-del="${i}" style="background:#c0442c;color:#fff;padding:6px 12px">Sí, eliminar</button>
            <button class="btn btn-ghost" data-cancel-del="${i}" style="padding:6px 12px">Cancelar</button>
          </div>
        `;
      }
      return `
        <div class="list-row" style="grid-template-columns:1fr auto auto;gap:8px;cursor:default">
          <span style="font-weight:600;color:var(--azul-950);font-size:14px">${esc(a)}</span>
          <button class="btn btn-ghost" data-edit="${i}" style="padding:6px 14px">Editar</button>
          <button class="btn btn-danger" data-delete="${i}" style="padding:6px 14px">Eliminar</button>
        </div>
      `;
    }).join("");

    if (editingIndex >= 0) {
      const editInp = document.getElementById(`editAsesorInput_${editingIndex}`);
      if (editInp) {
        editInp.focus();
        editInp.select();
        editInp.addEventListener("keydown", e => {
          if (e.key === "Enter") {
            const btn = list.querySelector(`[data-save-edit="${editingIndex}"]`);
            if (btn) btn.click();
          } else if (e.key === "Escape") { editingIndex = -1; paintAsesores(); }
        });
      }
    }
    list.querySelectorAll("[data-edit]").forEach(btn => btn.addEventListener("click", () => {
      editingIndex = Number(btn.dataset.edit); deletingIndex = -1; paintAsesores();
    }));
    list.querySelectorAll("[data-save-edit]").forEach(btn => btn.addEventListener("click", () => {
      const i = Number(btn.dataset.saveEdit);
      const input = document.getElementById(`editAsesorInput_${i}`);
      const nuevo = input ? input.value.trim() : "";
      if (!nuevo) return toast("El nombre no puede quedar vacío", true);
      const asesoresActuales = [...getAsesoresList()];
      if (asesoresActuales.some((a, j) => j !== i && norm(a) === norm(nuevo))) {
        return toast("Ya existe un asesor con ese nombre", true);
      }
      asesoresActuales[i] = nuevo;
      STATE.cyp.asesores = asesoresActuales;
      editingIndex = -1;
      toast("Asesor actualizado con éxito");
      paintAsesores();
    }));
    list.querySelectorAll("[data-cancel-edit]").forEach(btn => btn.addEventListener("click", () => { editingIndex = -1; paintAsesores(); }));
    list.querySelectorAll("[data-delete]").forEach(btn => btn.addEventListener("click", () => { deletingIndex = Number(btn.dataset.delete); editingIndex = -1; paintAsesores(); }));
    list.querySelectorAll("[data-confirm-del]").forEach(btn => btn.addEventListener("click", () => {
      const i = Number(btn.dataset.confirmDel);
      const asesoresActuales = [...getAsesoresList()];
      if (i >= 0 && i < asesoresActuales.length) {
        const removed = asesoresActuales.splice(i, 1)[0];
        deletingIndex = -1; editingIndex = -1;
        STATE.cyp.asesores = asesoresActuales;
        toast(`Asesor "${removed}" eliminado`);
        paintAsesores();
      }
    }));
    list.querySelectorAll("[data-cancel-del]").forEach(btn => btn.addEventListener("click", () => { deletingIndex = -1; paintAsesores(); }));
  }

  const addBtn = document.getElementById("addAsesorBtn");
  const addInput = document.getElementById("asesorNombre");
  function handleAdd() {
    const nombre = addInput.value.trim();
    if (!nombre) return toast("Escribe el nombre del asesor", true);
    const asesoresActuales = [...getAsesoresList()];
    if (asesoresActuales.some(a => norm(a) === norm(nombre))) return toast("Ese asesor ya existe", true);
    asesoresActuales.push(nombre);
    STATE.cyp.asesores = asesoresActuales;
    addInput.value = "";
    toast("Asesor agregado correctamente");
    paintAsesores();
    addInput.focus();
  }
  addBtn.addEventListener("click", handleAdd);
  addInput.addEventListener("keydown", e => { if (e.key === "Enter") handleAdd(); });
  paintAsesores();
};

/* ---------- 📁 COTIZACIONES GUARDADAS (BÚSQUEDA Y ORDENAMIENTO) ---------- */
Views.renderGuardadas = function () {
  const el = document.getElementById("view-guardadas");
  el.innerHTML = `
    <div class="section-head">
      <h2>Cotizaciones guardadas</h2>
      <span class="back" onclick="Router.go('home')">← Volver al inicio</span>
    </div>
    <div class="card">
      <div class="search-bar">
        <input id="cotSearch" placeholder="Buscar por N.°, cliente o asesor..." autocomplete="off">
      </div>
      <div class="list-row head" id="cotHeaderRow">
        <span data-sort="numero">N.° <b class="sort-ic"></b></span>
        <span data-sort="cliente">Cliente <b class="sort-ic"></b></span>
        <span data-sort="fecha">Fecha <b class="sort-ic"></b></span>
        <span data-sort="asesor">Asesor <b class="sort-ic"></b></span>
        <span data-sort="total" style="text-align:right">Total <b class="sort-ic"></b></span>
      </div>
      <div id="cotList"></div>
    </div>
  `;

  let sortCol = "numero";
  let sortAsc = false;
  let currentSearch = "";

  function paint() {
    const list = document.getElementById("cotList");
    if (!list) return;
    let cots = DB.getCotizaciones().slice();
    const q = norm(currentSearch);
    if (q) {
      cots = cots.filter(c =>
        (c.numero && norm(c.numero).includes(q)) ||
        (c.cliente && norm(c.cliente).includes(q)) ||
        (c.asesor && norm(c.asesor).includes(q))
      );
    }
    cots.sort((a, b) => {
      let res = 0;
      if (sortCol === "numero") res = String(a.numero || "").localeCompare(String(b.numero || ""), undefined, { numeric: true });
      else if (sortCol === "cliente") res = String(a.cliente || "").localeCompare(String(b.cliente || ""));
      else if (sortCol === "fecha") res = String(a.fecha || "").localeCompare(String(b.fecha || ""));
      else if (sortCol === "asesor") res = String(a.asesor || "").localeCompare(String(b.asesor || ""));
      else if (sortCol === "total") res = (Number(a.total) || 0) - (Number(b.total) || 0);
      return sortAsc ? res : -res;
    });
    document.querySelectorAll("#cotHeaderRow span[data-sort]").forEach(sp => {
      const col = sp.dataset.sort;
      const ic = sp.querySelector(".sort-ic");
      if (col === sortCol) {
        sp.classList.add("sorted");
        if (ic) ic.textContent = sortAsc ? " ▲" : " ▼";
      } else {
        sp.classList.remove("sorted");
        if (ic) ic.textContent = "";
      }
    });
    if (!cots.length) {
      list.innerHTML = `<div class="empty"><div class="ic">🔍</div>Sin resultados</div>`;
      return;
    }
    list.innerHTML = cots.map(c => `
      <div class="list-row" data-numero="${esc(c.numero)}">
        <span class="n">${esc(c.numero)}</span>
        <span>${esc(c.cliente || "—")}</span>
        <span>${esc(c.fecha || "")}</span>
        <span>${esc(c.asesor || "—")}</span>
        <span style="font-family:var(--mono);font-weight:700;color:var(--azul-950);text-align:right">${fmtCOP(c.total)}</span>
      </div>
    `).join("");
    list.querySelectorAll(".list-row[data-numero]").forEach(row => {
      row.addEventListener("click", () => Router.go("nueva", { record: row.dataset.numero }));
    });
  }

  document.querySelectorAll("#cotHeaderRow span[data-sort]").forEach(sp => {
    sp.addEventListener("click", () => {
      const col = sp.dataset.sort;
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      paint();
    });
  });
  const searchInput = document.getElementById("cotSearch");
  searchInput.addEventListener("input", e => { currentSearch = e.target.value; paint(); });
  paint();
};

/* ---------- ITEMS UI ---------- */
const ItemsUI = { items: [] };
ItemsUI.add = function () {
  this.items.push({ codigo: "", descripcion: "", cantidad: 1, vrUnitario: 0, ivaPct: 0.19, costo: 0, porcentaje: 0.25 });
  this.paint();
};
ItemsUI.remove = function (i) {
  this.items.splice(i, 1);
  if (!this.items.length) {
    this.items.push({ codigo: "", descripcion: "", cantidad: 1, vrUnitario: 0, ivaPct: 0.19, costo: 0, porcentaje: 0.25 });
  }
  this.paint();
};
ItemsUI.paint = function () {
  const body = document.getElementById("itemsBody");
  if (!body) return;
  body.innerHTML = this.items.map((it, i) => `
    <tr>
      <td>
        <input class="it-codigo" data-i="${i}" value="${esc(it.codigo)}" placeholder="Código..." autocomplete="off">
        <div class="ac-list ac-products" id="ac_item_cod_${i}"></div>
      </td>
      <td>
        <input class="it-desc" data-i="${i}" value="${esc(it.descripcion)}" placeholder="Descripción del producto..." autocomplete="off">
        <div class="ac-list ac-products" id="ac_item_desc_${i}"></div>
      </td>
      <td><input class="it-cant num" data-i="${i}" type="number" min="1" step="1" value="${it.cantidad != null ? it.cantidad : 1}"></td>
      <td><input class="it-vu num" data-i="${i}" type="number" min="0" step="1" value="${Math.round(it.vrUnitario || 0)}"></td>
      <td><input class="it-iva num" data-i="${i}" type="number" min="0" step="1" value="${Math.round((it.ivaPct || 0) * 100)}"></td>
      <td class="num" id="it-vi-${i}">${fmtCOP(0)}</td>
      <td class="num" id="it-vt-${i}">${fmtCOP(0)}</td>
      <td><input class="it-util num" data-i="${i}" type="number" min="0" step="1" value="${Math.round((it.porcentaje != null ? it.porcentaje : 0.25) * 100)}"></td>
      <td><input class="it-costo num" data-i="${i}" type="number" min="0" step="1" value="${Math.round(it.costo || 0)}"></td>
      <td><input class="it-prov" data-i="${i}" value="${esc(it.proveedor || "")}" placeholder="Proveedor"></td>
      <td style="text-align:center"><button class="rm" onclick="ItemsUI.remove(${i})" title="Eliminar fila">✕</button></td>
    </tr>
  `).join("");

  this.items.forEach((it, i) => {
    const codInput = body.querySelector(`.it-codigo[data-i="${i}"]`);
    const descInput = body.querySelector(`.it-desc[data-i="${i}"]`);
    const acCodList = document.getElementById(`ac_item_cod_${i}`);
    const acDescList = document.getElementById(`ac_item_desc_${i}`);

    const onPickProduct = d => {
      const util = this.items[i].porcentaje != null ? this.items[i].porcentaje : 0.25;
      let ivaPct = Number(d[2]) || 0;
      if (ivaPct > 1) ivaPct = ivaPct / 100;
      this.items[i].codigo = d[0] || "";
      this.items[i].descripcion = d[1] || "";
      this.items[i].ivaPct = ivaPct;
      this.items[i].costo = Number(d[4]) || 0;
      this.items[i].proveedor = d[5] || "";
      this.items[i].porcentaje = util;
      this.items[i].vrUnitario = Math.round((Number(d[4]) || 0) * (1 + util));
      this.paint();
    };
    const renderProductItem = d => `
      <div class="ac-prod-top">
        <span class="ac-badge-code">${esc(d[0])}</span>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="ac-badge-iva">IVA ${Math.round(((Number(d[2]) > 1 ? Number(d[2]) : Number(d[2]) * 100)) || 0)}%</span>
          ${d[4] ? `<span class="ac-badge-costo">Costo: ${fmtCOP(d[4])}</span>` : ""}
        </div>
      </div>
      <div class="ac-prod-name">${esc(d[1])}</div>
      ${d[5] ? `<div class="ac-prod-prov">Proveedor: <b>${esc(d[5])}</b></div>` : ""}
    `;
    const getProducts = q => {
      const datos = DB.getDatos();
      return datos.filter(d => (d[0] && norm(d[0]).includes(q)) || (d[1] && norm(d[1]).includes(q)));
    };

    if (codInput && acCodList) attachAutocomplete(codInput, acCodList, getProducts, renderProductItem, onPickProduct, "ac-prod-card");
    if (descInput && acDescList) attachAutocomplete(descInput, acDescList, getProducts, renderProductItem, onPickProduct, "ac-prod-card");

    body.querySelector(`.it-desc[data-i="${i}"]`).addEventListener("input", e => { this.items[i].descripcion = e.target.value; });
    body.querySelector(`.it-codigo[data-i="${i}"]`).addEventListener("input", e => { this.items[i].codigo = e.target.value; });
    body.querySelector(`.it-cant[data-i="${i}"]`).addEventListener("input", e => { this.items[i].cantidad = parseNum(e.target.value); this.recalc(); });
    body.querySelector(`.it-vu[data-i="${i}"]`).addEventListener("input", e => { this.items[i].vrUnitario = parseNum(e.target.value); this.recalc(); });
    body.querySelector(`.it-iva[data-i="${i}"]`).addEventListener("input", e => { this.items[i].ivaPct = parseNum(e.target.value) / 100; this.recalc(); });
    body.querySelector(`.it-costo[data-i="${i}"]`).addEventListener("input", e => {
      this.items[i].costo = parseNum(e.target.value);
      const util = this.items[i].porcentaje != null ? this.items[i].porcentaje : 0.25;
      this.items[i].vrUnitario = Math.round(this.items[i].costo * (1 + util));
      const vuInput = body.querySelector(`.it-vu[data-i="${i}"]`);
      if (vuInput) vuInput.value = this.items[i].vrUnitario;
      this.recalc();
    });
    body.querySelector(`.it-prov[data-i="${i}"]`).addEventListener("input", e => { this.items[i].proveedor = e.target.value; });
    body.querySelector(`.it-util[data-i="${i}"]`).addEventListener("input", e => {
      this.items[i].porcentaje = parseNum(e.target.value) / 100;
      if (this.items[i].costo) {
        this.items[i].vrUnitario = Math.round(this.items[i].costo * (1 + this.items[i].porcentaje));
        const vuInput = body.querySelector(`.it-vu[data-i="${i}"]`);
        if (vuInput) vuInput.value = Math.round(this.items[i].vrUnitario);
      }
      this.recalc();
    });
  });
  this.recalc();
};

ItemsUI.recalc = function () {
  let subtotal = 0, iva = 0;
  this.items.forEach((it, i) => {
    const cant = Number(it.cantidad) || 0;
    const vu = Number(it.vrUnitario) || 0;
    const ivaPct = Number(it.ivaPct) || 0;
    const vt = cant * vu;
    const vi = vt * ivaPct;
    subtotal += vt;
    iva += vi;
    const eVi = document.getElementById(`it-vi-${i}`);
    const eVt = document.getElementById(`it-vt-${i}`);
    if (eVi) eVi.textContent = fmtCOP(vi);
    if (eVt) eVt.textContent = fmtCOP(vt);
  });
  const eSub = document.getElementById("t_subtotal");
  const eIva = document.getElementById("t_iva");
  const eTot = document.getElementById("t_total");
  if (eSub) eSub.textContent = fmtCOP(subtotal);
  if (eIva) eIva.textContent = fmtCOP(iva);
  if (eTot) eTot.textContent = fmtCOP(subtotal + iva);
};

/* ============================================================
   COTIZADOR — Guardar (en memoria) y generar PDF
   ============================================================ */
const Cotizador = {
  _editingNumero: null,

  collect() {
    return {
      cliente: (document.getElementById("f_cliente") ? document.getElementById("f_cliente").value : "").trim(),
      nit: (document.getElementById("f_nit") ? document.getElementById("f_nit").value : "").trim(),
      ciudad: (document.getElementById("f_ciudad") ? document.getElementById("f_ciudad").value : "").trim(),
      contacto: (document.getElementById("f_contacto") ? document.getElementById("f_contacto").value : "").trim(),
      tiempoEntrega: (document.getElementById("f_tiempo") ? document.getElementById("f_tiempo").value : "").trim(),
      formaPago: (document.getElementById("f_pago") ? document.getElementById("f_pago").value : "").trim(),
      validez: (document.getElementById("f_validez") ? document.getElementById("f_validez").value : "").trim(),
      asesor: (document.getElementById("f_asesor") ? document.getElementById("f_asesor").value : "").trim(),
      fecha: (document.getElementById("f_fecha") ? document.getElementById("f_fecha").value : "").trim(),
      observaciones: document.getElementById("f_obs") ? document.getElementById("f_obs").value : ""
    };
  },

  validate(data, withPdf) {
    document.querySelectorAll("#view-nueva .err").forEach(e => e.classList.remove("err"));
    if (!withPdf) {
      const missing = [];
      if (!data.cliente) { missing.push("Cliente"); const el = document.getElementById("f_cliente"); if (el) el.classList.add("err"); }
      if (!data.asesor) { missing.push("Asesor"); const el = document.getElementById("f_asesor"); if (el) el.classList.add("err"); }
      return missing;
    } else {
      const required = {
        cliente: "Cliente", contacto: "Contacto", tiempoEntrega: "Tiempo de entrega",
        formaPago: "Forma de pago", validez: "Validez de la oferta", asesor: "Asesor"
      };
      const map = {
        cliente: "f_cliente", contacto: "f_contacto", tiempoEntrega: "f_tiempo",
        formaPago: "f_pago", validez: "f_validez", asesor: "f_asesor"
      };
      const missing = [];
      for (const key in required) {
        if (!data[key]) {
          missing.push(required[key]);
          const el = document.getElementById(map[key]);
          if (el) el.classList.add("err");
        }
      }
      return missing;
    }
  },

  async save(withPdf) {
    const data = this.collect();
    const missing = this.validate(data, withPdf);
    if (missing.length) {
      return toast(withPdf ? "Para generar el PDF debes completar: " + missing.join(", ") : "Falta completar: " + missing.join(", "), true);
    }
    const items = ItemsUI.items.filter(it => (it.codigo && String(it.codigo).trim()) || (it.descripcion && String(it.descripcion).trim()));
    if (withPdf && !items.length) {
      return toast("Para generar el PDF debes agregar al menos un producto a la cotización", true);
    }
    let subtotal = 0, iva = 0;
    items.forEach(it => {
      const cant = Number(it.cantidad) || 0;
      const vu = Number(it.vrUnitario) || 0;
      const ivaP = Number(it.ivaPct) || 0;
      const vt = cant * vu;
      subtotal += vt;
      iva += vt * ivaP;
    });

    const isEdit = !!this._editingNumero;
    let numero = this._editingNumero;
    if (!numero) numero = DB.nextNumero().preview;

    const record = { numero, ...data, items, subtotal, iva, total: subtotal + iva };
    const all = [...DB.getCotizaciones()];
    const idx = all.findIndex(c => c.numero === numero);
    if (idx >= 0) all[idx] = record;
    else all.push(record);
    DB.setCotizaciones(all);
    this._editingNumero = null;

    toast(isEdit ? `Cotización ${numero} actualizada` : `Cotización ${numero} guardada`);
    if (withPdf) await this.writePdf(record);
    Router.go("guardadas");
  },

  async remove(numero) {
    DB.setCotizaciones(DB.getCotizaciones().filter(c => c.numero !== numero));
    toast(`Cotización ${numero} eliminada`);
    Router.go("guardadas");
  },

  async writePdf(record) {
    const filename = `${record.numero}.pdf`;
    try {
      const blob = PdfBuilder.build(record);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast(`PDF ${filename} descargado`);
    } catch (e) {
      console.error(e);
      toast("No se pudo generar el PDF: " + e.message, true);
    }
  }
};

/* ============================================================
   GENERADOR DE PDF (jsPDF) — diseño igual al de la app real
   ============================================================ */
const PdfBuilder = {
  build(r) {
    const { jsPDF } = window.jspdf;
    const pageW = 595.28;
    const probe = new jsPDF({ unit: "pt", format: [pageW, 3000], orientation: "p" });
    const finalY = this.renderContent(probe, r, pageW);
    const minH = 841.89;
    const finalH = Math.max(finalY + 30, minH);
    const doc = new jsPDF({ unit: "pt", format: [pageW, finalH], orientation: "p" });
    this.renderContent(doc, r, pageW);
    return doc.output("blob");
  },

  renderContent(doc, r, pageW) {
    const M = 36;
    const contentW = pageW - 2 * M;
    const navy = [27, 58, 107];
    const bgBadge = [238, 242, 247];
    const bgPanel = [250, 251, 252];
    const bgZebra = [247, 249, 251];
    const border = [214, 222, 232];
    const borderSoft = [230, 234, 240];
    const textDark = [43, 43, 43];
    const textMuted = [102, 102, 102];
    const labelKey = [138, 148, 163];
    const footerColor = [154, 163, 177];

    let y = 28;

    // 1. ENCABEZADO — identidad de la empresa (sin logo de imagen en simulación)
    const logoW = 120, logoH = 48;
    doc.setFillColor(...navy);
    doc.roundedRect(M, y, logoW, logoH, 4, 4, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.text("M&M", M + logoW / 2, y + 22, { align: "center" });
    doc.setFontSize(6.5);
    doc.text("MEDICAL", M + logoW / 2, y + 31, { align: "center" });

    const infoX = M + logoW + 12;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10.5);
    doc.setTextColor(...navy);
    doc.text("REPRESENTACIONES M&M MEDICAL SAS", infoX, y + 10);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.5);
    doc.setTextColor(...textMuted);
    const compLines = [
      "NIT: 901265748-6",
      "Calle 32 # 29 - 17 Barrio La Aurora, Bucaramanga - Santander",
      "Tel: 3153761841 - 3045393418 - 3162230465",
      "ventas.representacionesmym@gmail.com",
      "www.representacionesmymmedical.com"
    ];
    compLines.forEach((line, idx) => doc.text(line, infoX, y + 21 + idx * 9.5));

    const badgeW = 120;
    const badgeX = pageW - M - badgeW;
    const badgeY = y;
    doc.setFillColor(...navy);
    doc.roundedRect(badgeX, badgeY, badgeW, 20, 3, 3, "F");
    doc.rect(badgeX, badgeY + 16, badgeW, 4, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11);
    doc.text("COTIZACIÓN", badgeX + badgeW / 2, badgeY + 14, { align: "center" });
    doc.setFillColor(...bgBadge);
    doc.setDrawColor(...border);
    doc.setLineWidth(0.8);
    doc.rect(badgeX, badgeY + 20, badgeW, 20, "FD");
    doc.setTextColor(...navy);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10.5);
    doc.text(String(r.numero || "C-2026-1"), badgeX + badgeW / 2, badgeY + 34, { align: "center" });
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(...textMuted);
    doc.text("Fecha: " + (r.fecha || ""), badgeX + badgeW, badgeY + 52, { align: "right" });

    y += 66;
    doc.setDrawColor(...navy);
    doc.setLineWidth(2);
    doc.line(M, y, pageW - M, y);
    y += 12;

    // 2. PANEL CLIENTE
    const clientCells = [
      { label: "CLIENTE", value: r.cliente || "—", w: contentW * 0.34 },
      { label: "NIT", value: r.nit || "—", w: contentW * 0.18 },
      { label: "CIUDAD", value: r.ciudad || "—", w: contentW * 0.26 },
      { label: "CONTACTO", value: r.contacto || "—", w: contentW * 0.22 }
    ];
    y = this.renderPanel(doc, clientCells, M, y, contentW, bgPanel, border, labelKey, textDark);

    // 3. CONDICIONES COMERCIALES
    const termsCells = [
      { label: "TIEMPO DE ENTREGA", value: r.tiempoEntrega || "—", w: contentW * 0.34 },
      { label: "FORMA DE PAGO", value: r.formaPago || "—", w: contentW * 0.33 },
      { label: "VALIDEZ DE LA OFERTA", value: r.validez || "15 días", w: contentW * 0.33 }
    ];
    y = this.renderPanel(doc, termsCells, M, y, contentW, bgPanel, border, labelKey, textDark);
    y += 14;

    // 4. TABLA DE PRODUCTOS
    const cols = [
      { key: "codigo", label: "CÓDIGO", w: 58, align: "center" },
      { key: "descripcion", label: "DESCRIPCIÓN", w: contentW - 58 - 36 - 72 - 42 - 76, align: "left" },

      { key: "vrUnitario", label: "VR. UNITARIO", w: 72, align: "right" },
      { key: "ivaPct", label: "IVA %", w: 42, align: "center" },
      { key: "valorTotal", label: "VR. TOTAL", w: 76, align: "right" }
    ];
    doc.setFillColor(...navy);
    doc.roundedRect(M, y, contentW, 20, 3, 3, "F");
    doc.rect(M, y + 15, contentW, 5, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8);
    doc.setTextColor(255, 255, 255);
    let curX = M;
    cols.forEach(c => {
      let tx = curX + 6;
      if (c.align === "center") tx = curX + c.w / 2;
      else if (c.align === "right") tx = curX + c.w - 6;
      doc.text(c.label, tx, y + 13, { align: c.align });
      curX += c.w;
    });
    y += 20;

    const items = Array.isArray(r.items) ? r.items : [];
    doc.setLineWidth(0.6);
    items.forEach((it, idx) => {
      const vt = (Number(it.cantidad) || 0) * (Number(it.vrUnitario) || 0);
      const isEven = idx % 2 === 1;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.5);
      const descLines = doc.splitTextToSize(String(it.descripcion || ""), cols[1].w - 12);
      const rowH = Math.max(18, 8 + descLines.length * 10);
      if (isEven) { doc.setFillColor(...bgZebra); doc.rect(M, y, contentW, rowH, "F"); }
      doc.setDrawColor(...borderSoft);
      doc.line(M, y + rowH, pageW - M, y + rowH);
      curX = M;
      doc.setTextColor(...textDark);
      doc.text(String(it.codigo || ""), curX + cols[0].w / 2, y + 12, { align: "center" });
      curX += cols[0].w;
      doc.text(descLines, curX + 6, y + 12);
      curX += cols[1].w;
      doc.text(String(it.cantidad || 0), curX + cols[2].w / 2, y + 12, { align: "center" });
      curX += cols[2].w;
      doc.text(fmtCOP(it.vrUnitario), curX + cols[3].w - 6, y + 12, { align: "right" });
      curX += cols[3].w;
      const ivaStr = Math.round((Number(it.ivaPct) || 0) * 100) + "%";
      doc.text(ivaStr, curX + cols[4].w / 2, y + 12, { align: "center" });
      curX += cols[4].w;
      doc.text(fmtCOP(vt), curX + cols[5].w - 6, y + 12, { align: "right" });
      y += rowH;
    });
    y += 8;

    // 5. TOTALES
    const totW = 195;
    const totX = pageW - M - totW;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.setTextColor(...textDark);
    doc.text("Subtotal:", totX + 10, y + 12);
    doc.text(fmtCOP(r.subtotal), totX + totW - 10, y + 12, { align: "right" });
    y += 16;
    doc.text("IVA:", totX + 10, y + 12);
    doc.text(fmtCOP(r.iva), totX + totW - 10, y + 12, { align: "right" });
    y += 16;
    doc.setDrawColor(...border);
    doc.setLineWidth(0.8);
    doc.line(totX, y, totX + totW, y);
    y += 3;
    doc.setFillColor(...navy);
    doc.roundedRect(totX, y, totW, 22, 3, 3, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10.5);
    doc.text("TOTAL:", totX + 12, y + 15);
    doc.text(fmtCOP(r.total), totX + totW - 12, y + 15, { align: "right" });
    y += 34;

    // 6. OBSERVACIONES + FIRMA
    const obsW = contentW * 0.58;
    const firW = contentW - obsW - 12;
    const boxTop = y;
    const defaultObs =
      "Favor consignar a: Bancolombia – Cuenta de Ahorros N.º 72600001670, a nombre de Representaciones M&M Medical SAS.\n\n" +
      "No somos grandes contribuyentes ni autorretenedores de renta.\n\n" +
      "Somos grandes contribuyentes de ICA en Bucaramanga – Res. 1017 del 31/05/2021. Favor no practicar ReteICA en otros municipios.";
    const obsText = (r.observaciones && r.observaciones.trim()) || defaultObs;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.6);
    const obsLines = doc.splitTextToSize(obsText, obsW - 20);
    const obsH = Math.max(92, 24 + obsLines.length * 10);
    doc.setFillColor(...bgPanel);
    doc.setDrawColor(...border);
    doc.setLineWidth(0.8);
    doc.roundedRect(M, boxTop, obsW, obsH, 4, 4, "FD");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8);
    doc.setTextColor(...navy);
    doc.text("OBSERVACIONES Y CONDICIONES", M + 10, boxTop + 14);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.6);
    doc.setTextColor(...textDark);
    doc.text(obsLines, M + 10, boxTop + 26);

    const firX = M + obsW + 12;
    doc.setFillColor(...bgPanel);
    doc.setDrawColor(...border);
    doc.setLineWidth(0.8);
    doc.roundedRect(firX, boxTop, firW, obsH, 4, 4, "FD");
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(...textMuted);
    doc.text("Cordialmente,", firX + 12, boxTop + 24);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.setTextColor(...navy);
    doc.text(String(r.asesor || "Equipo de Ventas"), firX + 12, boxTop + 52);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(...textMuted);
    doc.text("Representaciones M&M Medical SAS", firX + 12, boxTop + 65);
    y = boxTop + obsH + 16;

    // 7. PIE DE PÁGINA
    doc.setDrawColor(...borderSoft);
    doc.setLineWidth(0.6);
    doc.line(M, y, pageW - M, y);
    y += 10;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7.5);
    doc.setTextColor(...footerColor);
    doc.text(
      "Representaciones M&M Medical SAS · Bucaramanga, Colombia · Documento generado electrónicamente",
      pageW / 2, y,
      { align: "center" }
    );
    return y + 10;
  },

  renderPanel(doc, cells, x0, y0, totalW, bgColor, borderColor, labelColor, valColor) {
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    const wrapped = cells.map(c => doc.splitTextToSize(String(c.value || "—"), c.w - 12));
    const maxLines = Math.max(1, ...wrapped.map(l => l.length));
    const h = 18 + maxLines * 11;
    doc.setFillColor(...bgColor);
    doc.setDrawColor(...borderColor);
    doc.setLineWidth(0.8);
    doc.roundedRect(x0, y0, totalW, h, 4, 4, "FD");
    let curX = x0;
    cells.forEach((c, idx) => {
      if (idx > 0) { doc.setDrawColor(...borderColor); doc.line(curX, y0, curX, y0 + h); }
      doc.setFont("helvetica", "bold");
      doc.setFontSize(7.2);
      doc.setTextColor(...labelColor);
      doc.text(c.label, curX + 6, y0 + 11);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.8);
      doc.setTextColor(...valColor);
      doc.text(wrapped[idx], curX + 6, y0 + 23);
      curX += c.w;
    });
    return y0 + h;
  }
};

window.Router = Router;
window.Cotizador = Cotizador;
window.ItemsUI = ItemsUI;
window.Views = Views;
window.DB = DB;
</script>
